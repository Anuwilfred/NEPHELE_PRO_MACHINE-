version: "3.8"

# This is the real "always on" deployment target the project doc always
# pointed to (see README's "Where this runs for real, for free"): one
# Oracle Cloud "Always Free" VM, started once with `docker compose up -d
# --build` and left running. `restart: unless-stopped` on every service
# means Docker brings them back on its own if the VM ever reboots, so
# nothing here needs starting by hand again after the first time.

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vessel
      POSTGRES_PASSWORD: vessel
      POSTGRES_DB: vessel_dashboard
    # Deliberately NOT published to the host/internet -- only
    # ingestion-service and backend-api (on the compose network) need to
    # reach it. Exposing 5432 with these default credentials on a VM with a
    # public IP would be a real risk; "expose" keeps it reachable only
    # inside this compose network.
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vessel -d vessel_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingestion-service:
    build: ./ingestion-service
    restart: unless-stopped
    env_file:
      - ./ingestion-service/.env
    depends_on:
      db:
        condition: service_healthy

  backend-api:
    # Build context is the repo root, not ./backend-api -- see the comment
    # at the top of backend-api/Dockerfile for why (it needs to also copy
    # in the web-app folder it serves).
    build:
      context: .
      dockerfile: backend-api/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend-api/.env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
